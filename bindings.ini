# VIctory mouse and keyboard profile (built in; this file is the default).
# To use your own: copy it, edit it, and set VICTORY_MNK_BINDINGS=<path> before the start.
# Several keys for one button are separated by commas. Mouse1 = left, Mouse2 = right,
# Mouse3 = middle. Keys: A-Z, 0-9, Enter, Esc, Space, Tab, Shift, Ctrl, Alt, Backspace,
# Left, Right, Up, Down, or a Windows virtual key code such as 0xA2.
# Sensitivity is stick deflection per cursor pixel over an 8 ms polling interval.
# From ItsMK1/VIctory-MnK-patches (GPL-3); the Look* keys and the Z/C/X/Y/E/H keys keep
# the older keyboard stand-in's layout working.
Sensitivity = 0.135
MoveUp = W
MoveDown = S
MoveLeft = A
MoveRight = D
LookUp = I
LookDown = K
LookLeft = J
LookRight = L
RT = Mouse1, C
LT = Mouse2, Z
A = Shift, Enter
B = R, Backspace
X = Space, X
Y = F, Y
LB = Tab
RB = Q, E
LS = Ctrl
RS = Mouse3, H
Menu = Esc
View = V
DpadUp = Up
DpadDown = Down
DpadLeft = Left
DpadRight = Right
